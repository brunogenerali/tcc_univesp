[project]
name = "univesp-tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (organização automática de imports)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (manter sintaxe moderna)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


